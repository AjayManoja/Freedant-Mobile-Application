name: Deploy

# US-37: every green build of main is deployed. Images are built once per commit, scanned,
# pushed to GHCR, then rolled onto the host service by service through SSM Run Command
# (infra/host/deploy.sh). A failed on-host smoke test rolls back on the host; a failed
# smoke test from the internet afterwards triggers `deploy.sh --rollback`.
#
# Setup (docs/05-operations/DEPLOYMENT.md): a GitHub environment "production" with variables
# AWS_REGION, AWS_DEPLOY_ROLE_ARN (terraform output deploy_role_arn), AWS_INSTANCE_ID
# (terraform output instance_id) and PUBLIC_URL (https://<domain_name>).
# Manual redeploy or rollback to any commit: Actions → Deploy → Run workflow → sha.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (defaults to the branch head)
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      registry: ${{ steps.sha.outputs.registry }}
    steps:
      - id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full SHA: $sha"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >>"$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.service }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [identity, competition, payment, notification]
    env:
      IMAGE: ${{ needs.resolve.outputs.registry }}/feedants-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/service.Dockerfile
          target: migrate
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ env.IMAGE }}-migrate:${{ needs.resolve.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
      - name: Scan the pushed runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy to production
    needs: [resolve, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write # OIDC → AWS, no stored keys
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll out on the host
        run: |
          # The host fetches the deploy scripts for exactly this commit, so script and release match.
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/infra/host"
          script="d=\$(mktemp -d) && curl -fsSL $raw/lib.sh -o \$d/lib.sh && curl -fsSL $raw/deploy.sh -o \$d/deploy.sh && bash \$d/deploy.sh ${SHA}"
          infra/host/ssm-run.sh "$INSTANCE_ID" "$script"

      - name: Smoke test from the internet
        id: smoke
        run: infra/host/smoke.sh "${{ vars.PUBLIC_URL }}"

      - name: Roll back
        if: failure() && steps.smoke.outcome == 'failure'
        run: infra/host/ssm-run.sh "$INSTANCE_ID" "bash /opt/feedants/current/infra/host/deploy.sh --rollback"
