name: User story
description: A feature from the user's point of view
title: "[Story] "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <role>, I want <capability> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, one per line.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could, Won't (this release)]
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Area
      multiple: true
      options: [mobile, identity, competition, payment, notification, shared, infra, docs]
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: FR/NFR reference from docs/01-requirements/SRS.md (e.g. FR-10)
