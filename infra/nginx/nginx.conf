# API gateway, local stack (docs/02-design/HLD.md §2, API.md §6).
# The only public entry point: routing by path prefix, per-IP rate limits (stricter on
# sign-in and join), request size limits, request IDs, tracing, security headers, and
# /internal/* blocked. Shared settings live in http.conf and routes.conf; nginx.prod.conf
# adds TLS for production.

load_module modules/ngx_otel_module.so;

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/feedants/http.conf;

  server {
    listen 80;
    include /etc/nginx/feedants/routes.conf;
  }
}
