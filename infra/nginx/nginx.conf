# API gateway (docs/02-design/HLD.md §2, API.md §6).
# The only public entry point: routing by path prefix, per-IP rate limits (stricter on
# sign-in and join), request size limits, request IDs, security headers, and /internal/*
# blocked. TLS terminates here in production (Phase 5 adds the 443 server block).

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 256k;           # media goes straight to S3; JSON bodies are small
  client_body_timeout 10s;

  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=join:10m rate=30r/m;
  limit_req_status 429;

  # Docker's embedded DNS; `resolve` re-resolves upstreams, so a restarted container's new
  # IP is picked up and a second instance of a service joins the pool (NFR-SL-01).
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream identity     { zone identity 64k;     server identity:3001 resolve;     keepalive 16; }
  upstream competition  { zone competition 64k;  server competition:3002 resolve;  keepalive 16; }
  upstream payment      { zone payment 64k;      server payment:3003 resolve;      keepalive 16; }
  upstream notification { zone notification 64k; server notification:3004 resolve; keepalive 16; }

  map $http_x_request_id $req_id {
    default   $request_id;
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
  }

  server {
    listen 80;

    add_header X-Request-Id $req_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # Service-to-service only.
    location /internal/ { return 404; }

    location = /gateway/health { access_log off; return 200 'ok'; }

    # Identity
    location /v1/auth/otp/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://identity;
    }
    location /v1/auth/            { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }
    location = /v1/me             { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }
    location = /v1/me/avatar-upload-url { limit_req zone=api burst=10 nodelay; proxy_pass http://identity; }
    location = /.well-known/jwks.json { proxy_pass http://identity; }
    location ~ ^/v1/users/[^/]+/stats$ { limit_req zone=api burst=40 nodelay; proxy_pass http://competition; }
    location /v1/users/           { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }

    # Payment (the webhook is signature-checked by the service on the raw body)
    location = /v1/payments/webhook/razorpay { client_max_body_size 1m; proxy_pass http://payment; }
    location /v1/wallet           { limit_req zone=api burst=40 nodelay; proxy_pass http://payment; }
    # Fake-provider checkout for local demos; the service itself answers 404 in production.
    location = /v1/payments/dev/simulate { limit_req zone=api burst=10 nodelay; proxy_pass http://payment; }

    # Notification
    location /v1/notifications    { limit_req zone=api burst=40 nodelay; proxy_pass http://notification; }

    # Competition (everything else under /v1)
    location ~ ^/v1/competitions/[^/]+/join$ {
      limit_req zone=join burst=10 nodelay;
      proxy_pass http://competition;
    }
    location /v1/                 { limit_req zone=api burst=40 nodelay; proxy_pass http://competition; }

    location / { return 404; }
  }
}
