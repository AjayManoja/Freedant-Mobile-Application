# Shared server-level routing, included by the local and production server blocks.

add_header X-Request-Id $req_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $req_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;

# Service-to-service only.
location /internal/ { return 404; }

location = /gateway/health { access_log off; otel_trace off; return 200 'ok'; }

# Identity
location /v1/auth/otp/ {
  limit_req zone=auth burst=5 nodelay;
  proxy_pass http://identity;
}
location /v1/auth/            { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }
location = /v1/me             { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }
location = /v1/me/avatar-upload-url { limit_req zone=api burst=10 nodelay; proxy_pass http://identity; }
location = /.well-known/jwks.json { proxy_pass http://identity; }
location ~ ^/v1/users/[^/]+/stats$ { limit_req zone=api burst=40 nodelay; proxy_pass http://competition; }
location /v1/users/           { limit_req zone=api burst=40 nodelay; proxy_pass http://identity; }

# Payment (the webhook is signature-checked by the service on the raw body)
location = /v1/payments/webhook/razorpay { client_max_body_size 1m; proxy_pass http://payment; }
location /v1/wallet           { limit_req zone=api burst=40 nodelay; proxy_pass http://payment; }
# Fake-provider checkout for local demos; the service itself answers 404 in production.
location = /v1/payments/dev/simulate { limit_req zone=api burst=10 nodelay; proxy_pass http://payment; }

# Notification
location /v1/notifications    { limit_req zone=api burst=40 nodelay; proxy_pass http://notification; }

# Competition (everything else under /v1)
location ~ ^/v1/competitions/[^/]+/join$ {
  limit_req zone=join burst=10 nodelay;
  proxy_pass http://competition;
}
location /v1/                 { limit_req zone=api burst=40 nodelay; proxy_pass http://competition; }

location / { return 404; }
