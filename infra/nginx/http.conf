# Shared http-level settings, included by nginx.conf (local) and nginx.prod.conf (TLS).

server_tokens off;
sendfile on;
keepalive_timeout 65;
client_max_body_size 256k;           # media goes straight to S3; JSON bodies are small
client_body_timeout 10s;

gzip on;
gzip_types application/json text/plain;
gzip_min_length 1024;

# Tracing (US-36): one gateway span per request. An incoming traceparent is continued, a new
# trace starts otherwise, and the context is passed upstream so services join the same trace.
otel_exporter {
  endpoint jaeger:4317;
}
otel_service_name gateway;
otel_trace on;
otel_trace_context propagate;
otel_span_name "$request_method $uri";

log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","trace_id":"$otel_trace_id","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
access_log /dev/stdout json;
error_log /dev/stderr warn;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=join:10m rate=30r/m;
limit_req_status 429;

# Docker's embedded DNS; `resolve` re-resolves upstreams, so a restarted container's new
# IP is picked up and a second instance of a service joins the pool (NFR-SL-01).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream identity     { zone identity 64k;     server identity:3001 resolve;     keepalive 16; }
upstream competition  { zone competition 64k;  server competition:3002 resolve;  keepalive 16; }
upstream payment      { zone payment 64k;      server payment:3003 resolve;      keepalive 16; }
upstream notification { zone notification 64k; server notification:3004 resolve; keepalive 16; }

map $http_x_request_id $req_id {
  default   $request_id;
  "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
}
