# API gateway, production (US-37, NFR-SC-01): the same routes as nginx.conf behind TLS.
# Port 80 only answers Let's Encrypt HTTP-01 challenges and redirects everything else.
# Certificates are issued under the fixed name "feedants" (infra/host/renew-certs.sh), so
# this file never needs the domain name.

load_module modules/ngx_otel_module.so;

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/feedants/http.conf;

  server {
    listen 80 default_server;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /gateway/health { access_log off; otel_trace off; return 200 'ok'; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/feedants/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedants/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/feedants/routes.conf;
  }
}
