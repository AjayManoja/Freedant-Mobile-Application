<style>
  :root { --teal:#0d8074; --ink:#1b2b3a; --slate:#6b7d8c; --canvas:#f2f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Poppins',system-ui,sans-serif; background:var(--canvas); color:var(--ink); }
  header { padding:24px 28px; background:#fff; border-bottom:1px solid #e3e8ea; position:sticky; top:0; z-index:2; }
  header h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:var(--slate); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px; padding:28px; }
  .card { margin:0; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(27,43,58,.06); }
  figcaption { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid #eef1f2; font-size:12px; }
  .name { font-weight:700; }
  figcaption code { color:var(--slate); background:var(--canvas); padding:2px 6px; border-radius:6px; font-size:11px; margin-left:auto; }
  figcaption a { color:var(--teal); text-decoration:none; font-weight:600; }
  .card img { display:block; width:100%; height:auto; background:var(--canvas); }
</style></head>
